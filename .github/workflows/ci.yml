name: CI

on:
  workflow_dispatch: # manual butto

  push:
    branches: # when a change is made to main branch
      - main

jobs:
  hello: # name of our job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 # use the latest pre-built Github checkout action
      
      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"
        
      - name: Show environment
        run: |
          echo "Hello from GitHub Actions" # print something
          uname -a # name of the OS
          pwd # print the working directory / folder

      - name: List files
        run: ls -la

      - name: list contents of index.html
        run: cat src/index.html

name: CI

on:
  workflow_dispatch: # manual button

  push:
    branches: # when a change is made to main branch
      - main

    paths: # only changes which affect the src folder should trigger the workflow
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run tests
        run: echo "Tests passed"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build application
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html

  deploy-demo:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Inspect files
        run: ls -R .
        
      - name: Deploy
        run: echo "Deploying application"

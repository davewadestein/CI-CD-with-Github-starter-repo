# .github/workflows/ci.yml

name: CI

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          echo "Hello from GitHub Actions"
          uname -a
          pwd
      - name: List repository files
        run: ls -la

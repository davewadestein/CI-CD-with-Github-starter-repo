# .github/workflows/ci.yml

name: CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

  push:
    branches:
      - main
    paths:
      - 'src/**'

permissions:
  contents: read
  
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    runs-on: ubuntu-latest

    env:
      REGION: ${{ vars.DEPLOY_REGION }}

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run tests
        run: echo "All tests passed"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Show lint
        run: echo linting step
      
  build:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build application
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/

  deploy-demo:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      REGION: ${{ vars.DEPLOY_REGION }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ./dist

      - name: Show deployment configuration
        run: echo "Deploying to $REGION"

      - name: Verify deployment token
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "A deployment token was provided"
          echo "$TOKEN"

      - name: Show selected environment
        run: echo "Selected environment is ${{ inputs.environment }}"
